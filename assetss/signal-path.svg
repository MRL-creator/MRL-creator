<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">From Earth signal to software</title>
  <desc id="desc">A schematic scientific display with a gridded seismic trace, topographic contour lines, and a path from signal to data, algorithms, and code.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#29404b" stroke-width="1" opacity=".48"/>
      <circle cx="0" cy="0" r="1.4" fill="#5b8790" opacity=".55"/>
    </pattern>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".8" fill="#b8d2d4" opacity=".18"/>
      <circle cx="7" cy="6" r=".6" fill="#b8d2d4" opacity=".12"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#72bac3" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#72bac3" stop-opacity=".72"/>
      <stop offset="1" stop-color="#d0a77f" stop-opacity=".48"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="8" fill="#0d141a"/>
  <rect width="1200" height="320" rx="8" fill="url(#grid)"/>

  <g fill="none" stroke="#6c9296" stroke-width="1" opacity=".19">
    <path d="M-20 255C130 180 210 288 352 223S585 161 715 224s236 77 335 10 155-43 190-4"/>
