    <text x="1157" y="42" font-size="13" text-anchor="end" letter-spacing="1.5" fill="#778d95">SCHEMATIC · NOT TO SCALE</text>
  </g>

  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.4">
